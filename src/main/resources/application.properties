spring.application.name=web-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.sql.init.schema-locations=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true

spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}
spring.sql.init.data-locations=${SPRING_SQL_INIT_DATA_LOCATIONS:classpath:data.sql}

spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

aws.s3.region=us-east-1
aws.s3.prefix.comprovantes=comprovantes/
aws.s3.bucket.comprovantes=studio-essencia-comprovantes2

jwt.validity=${JWT_VALIDITY:3600}
jwt.secret=${JWT_SECRET:bWluaGFTZWNyZXRhU3VwZXJTZWd1cmExMjM0NTY3ODkw}

twilio.account-sid=swagger
twilio.auth-token=Swagger
twilio.whatsapp-number=SWAGGER

# RabbitMQ - publicacao de notificacoes (OTP / confirmacao) para o microservico
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin}

# Notificacao WhatsApp (contrato com o studio-many-scheduling-actions-service)
notificacao.exchange=exchange_notificacao
notificacao.queue=fila_notificacao_whatsapp
notificacao.routing-key=notificacao.whatsapp
# DLQ - deve ser IDENTICA a declarada pelo microservico de acoes
notificacao.dlx-exchange=exchange_notificacao_dlq
notificacao.dlq=fila_notificacao_whatsapp_dlq

# Tempo de vida do codigo OTP e do token de redefinicao (minutos)
otp.validade-minutos=${OTP_VALIDADE_MINUTOS:5}
otp.max-tentativas=${OTP_MAX_TENTATIVAS:5}
otp.reset-token-validade-minutos=${OTP_RESET_TOKEN_VALIDADE_MINUTOS:10}
