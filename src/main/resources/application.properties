spring.application.name=web-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/studioessencia?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.sql.init.schema-locations=
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:none}
spring.jpa.defer-datasource-initialization=true
# MySQL: db/init.sql e a fonte unica do schema. Os testes H2 ficam em
# src/test/resources/application.properties e usam schema gerado pelo Hibernate.
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}
spring.sql.init.data-locations=${SPRING_SQL_INIT_DATA_LOCATIONS:classpath:db/init.sql}
spring.sql.init.encoding=UTF-8

aws.s3.region=us-east-1
#aws.s3.prefix.comprovantes=agendamentos/
aws.s3.bucket.comprovantes=bucket-studio-teste-essencia-comprovante

jwt.validity=${JWT_VALIDITY:3600}
jwt.secret=${JWT_SECRET:bWluaGFTZWNyZXRhU3VwZXJTZWd1cmExMjM0NTY3ODkw}

# RabbitMQ - publicacao de notificacoes (OTP / agendamentos) para o microservico
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin}

# Notificacao WhatsApp (contrato com o studio-essencia-scheduling-actions-service)
notificacao.exchange=exchange_notificacao
notificacao.queue=fila_notificacao_whatsapp
notificacao.routing-key=notificacao.whatsapp
# DLQ - deve ser IDENTICA a declarada pelo microservico de acoes
notificacao.dlx-exchange=exchange_notificacao_dlq
notificacao.dlq=fila_notificacao_whatsapp_dlq

# Tempo de vida do codigo OTP e do token de redefinicao (minutos)
otp.validade-minutos=${OTP_VALIDADE_MINUTOS:5}
otp.max-tentativas=${OTP_MAX_TENTATIVAS:5}
otp.reset-token-validade-minutos=${OTP_RESET_TOKEN_VALIDADE_MINUTOS:10}
